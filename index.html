<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-login-top">
        <button onclick="window.location.href='in.html'">
            <i class="fa-regular fa-circle"></i> Admin Login
        </button>
    </div>
   
    <div class="pagecon">
        <div class="main-content">
            <div class="header-section">
                <img class="user-image" src="LOGO.png" alt="Logo"/>
                <h1>Sports Day '26</h1>
                <p>College Sports Day Registration portal</p>
            </div>

            <div class="form-container">
                <div class="tab-container">
                    <button class="tab-btn active" onclick="switchLogin('dept', this)">Department Login</button>
                    <button class="tab-btn" onclick="switchLogin('manager', this)">Event Management Login</button>
                </div>

                <form id="loginForm" onsubmit="fakeLogin(event)">
                    <div class="form-group">
                        <label id="idLabel">Department ID</label>
                        <div class="input-group">
                            <i class="fa-solid fa-building"></i>
                            <input type="text" id="userId" placeholder="e.g. DEPT-SALES-01" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>Password</label>
                            <a href="#"  class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required/> 
                            <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">Accepting the Terms and conditions</label>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentLoginType = 'dept'; 

        function switchLogin(type, btnElement) {
            currentLoginType = type;
            const idLabel = document.getElementById('idLabel');
            const userId = document.getElementById('userId');
            const tabs = document.querySelectorAll('.tab-btn');

            tabs.forEach(tab => tab.classList.remove('active'));
            btnElement.classList.add('active');

            if (type === 'dept') {
                idLabel.innerText = 'Department ID';
                userId.placeholder = 'e.g. DEPT-SALES-01';
            } else if (type === 'manager') {
                idLabel.innerText = 'Manager ID';
                userId.placeholder = 'e.g. MGR-001';
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }

      
    </script>
</body>
</html>
