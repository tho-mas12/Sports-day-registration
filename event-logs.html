<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Logs</title>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  margin:0;
}

.container{
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.logs{
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:14px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#f1f5f9;
}

.status{
  padding:6px 12px;
  border-radius:20px;
  color:white;
}

.active{
  background:#22c55e;
}

.completed{
  background:#2563eb;
}

.cancelled{
  background:#ef4444;
}

</style>
</head>

<body>

<div class="container">

  <h1>Event Activity Logs</h1>

  <div class="logs">

    <table>

      <thead>
        <tr>
          <th>Event</th>
          <th>Activity</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>Football Finals</td>
          <td>Event Created</td>
          <td>20-06-2026</td>
          <td>09:00 AM</td>
          <td><span class="status active">Active</span></td>
        </tr>

        <tr>
          <td>Basketball Match</td>
          <td>Venue Updated</td>
          <td>21-06-2026</td>
          <td>11:30 AM</td>
          <td><span class="status completed">Updated</span></td>
        </tr>

        <tr>
          <td>Marathon</td>
          <td>Event Cancelled</td>
          <td>22-06-2026</td>
          <td>01:00 PM</td>
          <td><span class="status cancelled">Cancelled</span></td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

</body>
</html>
